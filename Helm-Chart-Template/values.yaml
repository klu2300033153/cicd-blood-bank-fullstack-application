mysql:
  image: mysql:8.0
  storage: 5Gi
  rootPassword: root
  database: bloodbank
  pvcName: bloodbank-mysql-pvc

backend:
  image: srinivascharank/blood-bank-backend1:v1
  replicas: 2
  port: 8080
  nodePort: 30083

frontend:
  image: srinivascharank/blood-bank-frontend1:v1
  replicas: 2
  port: 8080
  nodePort: 30082

ingress:
  enabled: true
  host: blood-bank.com

autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
